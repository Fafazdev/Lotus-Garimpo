spring.application.name=LotusGarimpo
spring.thymeleaf.cache=false

# --- CONFIGURAÇÃO DO BANCO DE DADOS ---
# Corrigido: 'spring' (estava 'pring') e o nome do banco para 'lotus_garimpo'
spring.datasource.url=jdbc:mysql://localhost:3306/lotus_db?useTimezone=true&serverTimezone=UTC
# Credenciais via variáveis de ambiente; para desenvolvimento local os valores padrão são usados.
spring.datasource.username=${LOTUS_DB_USERNAME:root}
spring.datasource.password=${LOTUS_DB_PASSWORD:}

# Driver de conexão
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=9090

# --- SESSÃO ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Em produção com HTTPS, habilite: server.servlet.session.cookie.secure=true

# --- UPLOAD DE ARQUIVOS ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- SPRING SECURITY ---
# Desabilita o usuário padrão gerado automaticamente pelo Spring Boot
spring.security.user.name=disabled
spring.security.user.password=disabled


# ==========================
# Configuração de frete (Correios)
# ==========================
# CEP de origem da loja (apenas números)
lotus.frete.cep-origem=11010-970
# Código de serviço dos Correios (ex.: 04510 PAC, 04014 SEDEX)
lotus.frete.codigo-servico=04510


# ==========================
# Importa configurações locais (opcional)
# ==========================
# Se existir o arquivo application-oauth.properties, ele será lido também.
spring.config.import=optional:classpath:application-oauth.properties


